  <div class="display_question" id="question_104">
    <div class="question_type">multiple_choice_question</div>
    <div class="question_text">What is the derivative of sin(x)?</div>
    <div class="mc-answer ${s.q4correct ? 'correct' : 'incorrect'}">${escapeHTML(s.q4mc || '(no answer)')}</div>
    <div class="question_points">5 pts</div>
    <div style="margin-top: 8px;">Score: <input type="text" class="question_input" value="${s.q4correct ? '5' : '0'}"> / 5</div>
  </div>
  <div class="update-scores-wrap"><button class="update-scores">Update Scores</button></div>
</body></html>`;
}

function escapeHTML(str) {
  if (!str) return '<em style="color: #8b969e;">(no response)</em>';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

let currentIdx = 0;
function renderStudent(idx) {
  const s = students[idx];
  currentIdx = idx;
  document.getElementById('students_selectmenu').selectedIndex = idx;
  document.getElementById('submit-date').textContent = s.date || 'Not submitted';
  const statEls = document.querySelectorAll('.sg-header-right .stat-value');
  if (statEls[2]) statEls[2].textContent = `${idx + 1}/${students.length}`;
  document.getElementById('grade_input').value = '';
  try { document.getElementById('speed_grader_comment_rce_ifr').contentDocument.body.textContent = ''; } catch(e) {}
  const iframe = document.getElementById('submission-preview-iframe');
  iframe.srcdoc = buildQuizIframeHTML(s);
  iframe.onload = function() {
    try {
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
      const updateBtn = iframeDoc.querySelector('button.update-scores');
      if (updateBtn) {
        updateBtn.addEventListener('click', function() {
          const inputs = iframeDoc.querySelectorAll('.question_input');
          let total = 0;
          inputs.forEach(inp => { const v = parseFloat(inp.value); if (!isNaN(v)) total += v; });
          const scoreEl = iframeDoc.getElementById('current-score');
          if (scoreEl) scoreEl.textContent = total;
          document.getElementById('grade_input').value = total;
          updateBtn.textContent = 'Scores Updated!';
          updateBtn.style.background = '#0b874b';
          setTimeout(() => { updateBtn.textContent = 'Update Scores'; updateBtn.style.background = '#2d3b45'; }, 1500);
        });
      }
    } catch(e) {}
  };
}

document.getElementById('students_selectmenu').addEventListener('change', function() { renderStudent(this.selectedIndex); });
document.getElementById('prevStudent').addEventListener('click', function() { if (currentIdx > 0) renderStudent(currentIdx - 1); });
document.getElementById('nextStudent').addEventListener('click', function() { if (currentIdx < students.length - 1) renderStudent(currentIdx + 1); });
document.getElementById('comment_submit_button').addEventListener('click', function() {
  const rceIframe = document.getElementById('speed_grader_comment_rce_ifr');
  const hasContent = rceIframe && rceIframe.contentDocument?.body?.textContent?.trim();
  if (hasContent) {
    this.textContent = 'Submitted!';
    this.style.background = '#0b874b';
    setTimeout(() => { this.textContent = 'Submit'; this.style.background = '#2d3b45'; }, 1500);
  }
});
renderStudent(0);
</script>
</body>
</html>
