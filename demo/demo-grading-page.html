<!DOCTYPE html>
<html>
<head>
  <title>Grade All Questions - Demo Assignment</title>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 20px; background: #fff; color: #333; }
    h2 { border-bottom: 2px solid #369; padding-bottom: 6px; }
    form { max-width: 960px; margin: 0 auto; }
    div[data-lastchange] { border: 1px solid #ccc; margin: 16px 0; padding: 12px; background: #fafafa; border-radius: 4px; }
    div[data-lastchange] > b { font-size: 1.1em; color: #036; display: block; margin-bottom: 8px; }
    div[role="region"] { margin: 8px 0; padding: 8px; background: #fff; border: 1px solid #e0e0e0; border-radius: 3px; }
    p.seqsep { font-weight: bold; color: #555; margin: 10px 0 4px; padding: 4px 8px; background: #eef; border-radius: 3px; }
    p.seqsep[role="heading"] { font-size: 0.95em; }
    .scoredetails { margin-top: 10px; padding: 10px; background: #f5f5f5; border-radius: 4px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .scoredetails input[type="text"] { width: 50px; padding: 4px 6px; border: 1px solid #999; border-radius: 3px; font-size: 1em; text-align: center; }
    .scoredetails a.fullcredlink { color: #369; cursor: pointer; font-size: 0.9em; }
    div.fbbox { min-height: 60px; border: 1px solid #bbb; padding: 8px; border-radius: 3px; background: #fff; margin-top: 6px; width: 100%; box-sizing: border-box; }
    details { margin: 6px 0; }
    details summary { cursor: pointer; color: #369; font-weight: bold; font-size: 0.9em; }
    details table { width: 100%; border-collapse: collapse; margin-top: 4px; }
    details td, details th { padding: 4px 8px; border: 1px solid #ddd; vertical-align: top; }
    details b { color: #333; }
    details li { margin: 2px 0; }
    .prompt-text { margin: 6px 0; line-height: 1.5; }
    .student-response { padding: 8px; background: #fffff0; border: 1px dashed #cc9; border-radius: 3px; min-height: 40px; line-height: 1.5; }
    button[type="submit"], button.quicksave { padding: 8px 20px; font-size: 1em; border-radius: 4px; cursor: pointer; margin: 10px 5px; }
    button[type="submit"] { background: #369; color: #fff; border: 1px solid #258; }
    button.quicksave { background: #5a5; color: #fff; border: 1px solid #494; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .save-status { color: #666; font-style: italic; font-size: 0.9em; }
  </style>
</head>
<body>
<h2>Grade All Questions &ndash; Statistics Final: Central Limit Theorem &amp; Sampling Distributions</h2>
<div class="top-bar">
  <span class="save-status">Not saved yet</span>
  <div>
    <button class="quicksave" onclick="quickSave()">Quick Save</button>
    <button type="submit">Save Changes</button>
  </div>
</div>
<form id="gradeform">
<!--
  30 student sections are generated by the script at the bottom.
  DOM structure matches MyOpenMath gradeallq2.php exactly:
    div[data-lastchange] > b (name)
    div[data-lastchange] > div[role="region"] > ...parts...
    div[data-lastchange] > div.scoredetails > input[aria-label="Score"], div.fbbox, input[hidden]
-->
</form>

<div id="bottom-bar" style="text-align:center; margin: 20px 0; padding: 16px; background: #eef;">
  <button class="quicksave" onclick="quickSave()">Quick Save</button>
  <button type="submit" onclick="event.preventDefault(); quickSave();">Save Changes</button>
</div>

<script>
// Quick Save simulation
function quickSave() {
  var els = document.querySelectorAll('.save-status');
  for (var i = 0; i < els.length; i++) els[i].textContent = 'Saving...';
  setTimeout(function() {
    var t = new Date().toLocaleTimeString();
    var els2 = document.querySelectorAll('.save-status');
    for (var j = 0; j < els2.length; j++) els2[j].textContent = 'Saved at ' + t;
  }, 500);
}

// ── Student data ──────────────────────────────────────────────────
var students = [
  { name: "Anderson, Marcus", response: "The Central Limit Theorem (CLT) states that regardless of the population distribution, the sampling distribution of the sample mean approaches a normal distribution as the sample size n increases. The standard error is calculated as SE = \u03c3/\u221an. Since the margin of error is MOE = z* \u00d7 SE, increasing n makes SE smaller and therefore shrinks the margin of error. For example, quadrupling the sample size from 100 to 400 cuts the margin of error in half because \u221a400/\u221a100 = 20/10 = 2. This inverse square root relationship means there are diminishing returns \u2014 to get a 10\u00d7 improvement in precision, you need 100\u00d7 the sample size. This is why most national polls use around 1,000\u20131,500 respondents, balancing cost with acceptable precision." },
  { name: "Brooks, Jaylen", response: "The CLT says that sample means follow a normal distribution when n is large enough. Standard error = \u03c3/\u221an, so bigger samples give smaller SE. Since margin of error depends on SE (MOE = z* \u00d7 SE), a larger sample reduces the margin of error. This is why researchers want large samples \u2014 they produce more precise estimates of population parameters. The relationship follows an inverse square root pattern." },
  { name: "Chen, Lily", response: "According to the Central Limit Theorem, the sampling distribution of x-bar becomes approximately normal as n increases. The standard error \u03c3/\u221an decreases with larger n. Because the margin of error equals the critical value times the standard error, it decreases too. If you double n, the margin of error decreases by a factor of \u221a2 \u2248 1.41. To halve the margin of error, you need to quadruple n. This explains why polling organizations must balance sample size against cost \u2014 each incremental improvement in precision requires proportionally more data." },
  { name: "Davis, Amara", response: "Larger sample sizes decrease the margin of error. The CLT shows that sample means are normally distributed with standard error \u03c3/\u221an. Since MOE = z* \u00d7 SE, when n goes up, SE goes down, and so does the margin of error. This is fundamental to statistical inference \u2014 larger samples give tighter confidence intervals around our estimates." },
  { name: "Evans, Tyler", response: "The Central Limit Theorem tells us that the distribution of sample means becomes normal as sample size grows. The standard error is sigma over square root of n. The margin of error uses standard error in its formula, so when standard error shrinks from a bigger sample, the margin of error also shrinks. You need about 4 times the sample size to cut margin of error in half." },
  { name: "Flores, Isabella", response: "When we take larger samples, the Central Limit Theorem guarantees that the sampling distribution is approximately normal. The spread of this distribution is measured by standard error SE = \u03c3/\u221an. Margin of error = z* \u00d7 SE. So increasing n \u2192 decreasing SE \u2192 decreasing MOE. The practical implication is that researchers can get more precise estimates (narrower confidence intervals) by sampling more individuals, though with diminishing returns due to the square root." },
  { name: "Garcia, Diego", response: "The CLT says sample means are normal for large n. Standard error is \u03c3 divided by \u221an so it gets smaller with more data. Margin of error depends on standard error so it also gets smaller. This means bigger samples are more accurate. To reduce margin of error by half you need 4x the sample size." },
  { name: "Harris, Kayla", response: "Sample size affects margin of error through the Central Limit Theorem. Bigger samples have smaller standard errors because SE = \u03c3/\u221an. The margin of error formula includes SE, so when SE decreases, MOE decreases too. That's why polls with more people are more reliable \u2014 they have tighter margins of error and narrower confidence intervals." },
  { name: "Ibrahim, Fatima", response: "The Central Limit Theorem is about how sample means form a normal distribution. When you have a large sample, your estimate of the mean is better because the standard error (\u03c3/\u221an) is smaller. This connects to margin of error since MOE uses SE in its calculation. Larger n means smaller MOE which means more confidence in results." },
  { name: "Johnson, Devin", response: "The CLT explains that with large enough samples, the sampling distribution of the mean is approximately normal regardless of the underlying population shape. Standard error = \u03c3/\u221an decreases as n increases. Margin of error = z* \u00d7 (\u03c3/\u221an) also decreases. The key insight is the inverse square root relationship \u2014 doubling n only reduces MOE by about 29% (factor of 1/\u221a2). This has practical implications for survey design: there are diminishing returns to increasing sample size, which is why most surveys find an optimal n that balances cost and precision." },
  { name: "Kim, Sarah", response: "The Central Limit Theorem states that sample means will be normally distributed. With larger samples, the standard error gets smaller since SE equals sigma over root n. This matters because the margin of error includes the standard error in its formula. When SE is smaller, the margin of error is smaller too, giving more precise results. This is why sample size matters in statistics." },
  { name: "Lopez, Miguel", response: "Bigger samples = smaller margin of error. The CLT proves this because the standard error \u03c3/\u221an gets smaller when n increases. Since MOE = z \u00d7 SE, the margin of error decreases with larger n. A sample of 1000 has a much smaller margin than a sample of 100." },
  { name: "Martinez, Sofia", response: "The Central Limit Theorem is a fundamental concept that explains why larger samples produce more reliable estimates. As sample size increases, the sampling distribution of the mean becomes more tightly clustered around the true population mean. This happens because the standard error (\u03c3/\u221an) decreases with n. Since margin of error is calculated as z* \u00d7 SE, a smaller SE directly translates to a smaller margin of error. For practical applications like opinion polls, this means that increasing from 500 to 2000 respondents would cut the margin of error roughly in half (since \u221a(2000/500) = 2)." },
  { name: "Nguyen, Kevin", response: "According to the CLT, the distribution of sample means approaches normality as n increases. The standard error \u03c3/\u221an quantifies the spread of this distribution. Margin of error is directly proportional to SE through the formula MOE = z* \u00d7 SE. Therefore, increasing n reduces SE, which in turn reduces MOE. However, the relationship follows an inverse square root, meaning each doubling of n only gives about a 30% improvement in precision." },
  { name: "O'Brien, Patrick", response: "The Central Limit Theorem says that means from samples are normally distributed when n is big. Standard error goes down when n goes up because of the \u221an in the denominator. Margin of error also goes down because it depends on standard error. That's basically how sample size affects precision in statistics." },
  { name: "Patel, Priya", response: "Sample size and margin of error are inversely related through the CLT framework. The standard error SE = \u03c3/\u221an establishes this mathematical relationship. As n increases, SE decreases proportionally to 1/\u221an. The margin of error (MOE = z_\u03b1/2 \u00d7 SE) inherits this inverse square root relationship. Practically, to achieve a desired margin of error, we solve for n: n = (z \u00d7 \u03c3 / E)\u00b2. This formula is foundational in determining appropriate sample sizes for surveys, clinical trials, and quality control processes." },
  { name: "Quinn, Aiden", response: "The CLT is important for understanding samples. When you take a bigger sample, you get closer to the real answer. This reduces the margin of error because there's less chance of being wrong. The formula involves dividing by the square root of n, which is why bigger n means less error." },
  { name: "Rivera, Carmen", response: "Larger sample sizes lead to smaller margins of error because of the Central Limit Theorem. The theorem shows that SE = \u03c3/\u221an, so as n grows, SE shrinks. Margin of error is calculated using SE, so it shrinks too. This is why opinion polls report margins like \u00b13% \u2014 they've chosen a sample size that produces that level of precision." },
  { name: "Smith, Jordan", response: "The margin of error gets bigger when you have more samples because you have more data to be uncertain about. The Central Limit Theorem says things become normal with large samples. Standard error is \u03c3 times \u221an so it increases with more data." },
  { name: "Thompson, Brianna", response: "The CLT tells us that the sampling distribution of x\u0304 is approximately N(\u03bc, \u03c3\u00b2/n) for large n. The standard error \u03c3/\u221an decreases as n increases. Since MOE = z* \u00d7 \u03c3/\u221an, it follows that MOE decreases as well. The key mathematical insight is the 1/\u221an proportionality \u2014 margin of error is inversely proportional to the square root of sample size. This has an important practical consequence: there are diminishing returns to increasing n. Going from n=100 to n=400 halves the MOE, but getting another halving requires going to n=1600." },
  { name: "Uribe, Daniel", response: "According to the Central Limit Theorem, the mean of a sufficiently large number of independent random variables will be approximately normally distributed. This means that as we increase our sample size n, the standard error (calculated as \u03c3 divided by \u221an) decreases. Because margin of error is found by multiplying the critical value z* by the standard error, a decrease in SE directly causes a decrease in MOE. In practice this means that for a 95% confidence level, a sample of about 1,000 yields a margin of error around \u00b13%." },
  { name: "Vargas, Elena", response: "Sample size matters because of the Central Limit Theorem. Bigger samples have smaller standard errors (SE = \u03c3/\u221an) and therefore smaller margins of error. The inverse square root relationship means you get diminishing returns \u2014 each additional participant helps less than the previous one." },
  { name: "Washington, Malik", response: "The CLT states sample means are normally distributed. Standard error = \u03c3/\u221an. Margin of error = z \u00d7 SE. Bigger n \u2192 smaller SE \u2192 smaller margin. Need 4x n to halve the margin. This is the foundation of sample size calculations in survey research." },
  { name: "Xu, Michelle", response: "The Central Limit Theorem says that when you collect samples, the average of those samples forms a bell curve. With more data points, this curve gets narrower because the standard error decreases. Standard error is \u03c3/\u221an. The margin of error depends on standard error, so it also narrows. This explains why larger studies produce more precise estimates \u2014 their confidence intervals are tighter." },
  { name: "Young, Caleb", response: "I think the Central Limit Theorem has something to do with normal distributions and large samples. Margin of error probably goes down with more data because you have more information. Statistics uses this for surveys and polls." },
  { name: "Zhang, Amy", response: "The relationship between sample size and margin of error is mediated by the standard error, as described by the CLT. SE = \u03c3/\u221an captures how the spread of the sampling distribution shrinks with larger n. Since MOE = z* \u00d7 SE, the margin of error inherits this inverse square root decay. For researchers, this means: (1) larger samples always improve precision, but (2) the improvement has diminishing marginal returns, and (3) the required sample size scales quadratically with desired precision improvements. A practical rule: to estimate a proportion within \u00b13% at 95% confidence, you need about n \u2248 1,068 regardless of population size (for large populations)." },
  { name: "Adams, Hailey", response: "The CLT shows that sample means have a normal distribution. The standard error gets smaller with larger n. Margin of error uses standard error so it also gets smaller. This is why we prefer large samples in research \u2014 they give us more accurate estimates of what we're trying to measure." },
  { name: "Bennett, Chase", response: "" },
  { name: "Cooper, Maya", response: "Central Limit Theorem. Margin of error. Sample size. These are related. More samples is better for accuracy." },
  { name: "Diaz, Roberto", response: "The Central Limit Theorem is probably the most important theorem in statistics. It says that no matter what the population looks like \u2014 skewed, bimodal, uniform \u2014 the distribution of sample means will be approximately normal if n is large enough (usually n \u2265 30). The standard error SE = \u03c3/\u221an measures the typical distance between a sample mean and the population mean. Since margin of error equals z* \u00d7 SE, increasing n shrinks SE which shrinks MOE. This means we get narrower confidence intervals and more precise estimates. For example, in medical trials, this principle guides how many patients are needed to detect a treatment effect with acceptable precision." }
];

// Shared rubric content
var essayPromptHTML = '<p class="prompt-text">Explain how the Central Limit Theorem (CLT) relates sample size to the margin of error. In your response:</p>' +
  '<ul class="prompt-text">' +
  '<li>State what the CLT says about the sampling distribution of the sample mean</li>' +
  '<li>Explain the formula for standard error and how it depends on sample size</li>' +
  '<li>Connect standard error to the margin of error formula</li>' +
  '<li>Describe the practical implications of this relationship for researchers</li>' +
  '</ul>';

var checklistHTML = '<table>' +
  '<tr><td><b>CLT Statement</b></td><td>' +
  '<label>\u2610 States sampling distribution of x\u0304 approaches normality</label><br>' +
  '<label>\u2610 Mentions condition: sufficiently large n</label>' +
  '</td></tr>' +
  '<tr><td><b>Standard Error</b></td><td>' +
  '<label>\u2610 Provides formula SE = \u03c3/\u221an</label><br>' +
  '<label>\u2610 Explains SE decreases as n increases</label>' +
  '</td></tr>' +
  '<tr><td><b>Margin of Error Connection</b></td><td>' +
  '<label>\u2610 Provides MOE formula: MOE = z* \u00d7 SE</label><br>' +
  '<label>\u2610 Explains MOE decreases as SE decreases</label>' +
  '</td></tr>' +
  '<tr><td><b>Practical Implications</b></td><td>' +
  '<label>\u2610 Discusses inverse square root relationship or diminishing returns</label><br>' +
  '<label>\u2610 Provides concrete example or application</label>' +
  '</td></tr>' +
  '</table>';

var rubricHTML = '<table>' +
  '<tr><td><b>CLT Statement (2 pts)</b></td><td>' +
  '<ul>' +
  '<li>Full (2): Clearly states sampling distribution of x\u0304 approaches normal distribution as n increases</li>' +
  '<li>Partial (1): Mentions normality or CLT but vague or incomplete</li>' +
  '<li>Missing (0): No mention of what CLT states</li>' +
  '</ul></td></tr>' +
  '<tr><td><b>Standard Error (3 pts)</b></td><td>' +
  '<ul>' +
  '<li>Full (3): Correct formula SE = \u03c3/\u221an AND explains SE decreases with n</li>' +
  '<li>Partial (2): Formula OR explanation but not both</li>' +
  '<li>Minimal (1): Mentions SE without formula or clear explanation</li>' +
  '<li>Missing (0): No discussion of standard error</li>' +
  '</ul></td></tr>' +
  '<tr><td><b>MOE Connection (3 pts)</b></td><td>' +
  '<ul>' +
  '<li>Full (3): Correct MOE formula AND clear logical chain: \u2191n \u2192 \u2193SE \u2192 \u2193MOE</li>' +
  '<li>Partial (2): Shows connection but incomplete formula or chain</li>' +
  '<li>Minimal (1): States MOE decreases with n but no mechanism</li>' +
  '<li>Missing (0): No connection made</li>' +
  '</ul></td></tr>' +
  '<tr><td><b>Practical Implications (2 pts)</b></td><td>' +
  '<ul>' +
  '<li>Full (2): Discusses diminishing returns / inverse \u221an AND gives example</li>' +
  '<li>Partial (1): Mentions one practical aspect</li>' +
  '<li>Missing (0): No practical discussion</li>' +
  '</ul></td></tr>' +
  '</table>';

var modelResponseHTML = '<div><b>Model Response:</b><br>' +
  'The Central Limit Theorem states that the sampling distribution of the sample mean x\u0304 approaches ' +
  'a normal distribution N(\u03bc, \u03c3\u00b2/n) as the sample size n increases, regardless of the shape of the ' +
  'underlying population distribution. The standard error SE = \u03c3/\u221an quantifies the spread of this ' +
  'sampling distribution and decreases as n increases. Since the margin of error is calculated as ' +
  'MOE = z* \u00d7 SE = z* \u00d7 \u03c3/\u221an, an increase in sample size directly reduces the margin of error. ' +
  'This relationship follows an inverse square root pattern \u2014 to halve the margin of error, the sample ' +
  'size must be quadrupled. For researchers, this means there are diminishing returns to increasing ' +
  'sample size: going from n=100 to n=400 halves the MOE, but achieving another halving requires ' +
  'n=1,600. National polls typically use n \u2248 1,000\u20131,500 as a practical balance between cost and ' +
  'a margin of error around \u00b13% at the 95% confidence level.</div>';

// Build DOM using safe methods
var form = document.getElementById('gradeform');

students.forEach(function(s, i) {
  var ts = Math.floor(Date.now() / 1000) - i * 120;

  // Student wrapper
  var wrapper = document.createElement('div');
  wrapper.setAttribute('data-lastchange', ts.toString());

  // Name
  var nameEl = document.createElement('b');
  nameEl.textContent = s.name;
  wrapper.appendChild(nameEl);

  // Region
  var region = document.createElement('div');
  region.setAttribute('role', 'region');
  region.setAttribute('aria-label', 'Question ' + (i + 1));

  // Part 1 heading
  var p1heading = document.createElement('p');
  p1heading.className = 'seqsep';
  p1heading.setAttribute('role', 'heading');
  p1heading.setAttribute('aria-level', '3');
  p1heading.textContent = 'Part 1 of 2';
  region.appendChild(p1heading);

  // Part 1 content div
  var part1 = document.createElement('div');

  // Prompt + checklist div
  var promptDiv = document.createElement('div');
  // Using DOM parsing for the static HTML content
  var promptTemp = document.createElement('div');
  promptTemp.innerHTML = essayPromptHTML;
  while (promptTemp.firstChild) promptDiv.appendChild(promptTemp.firstChild);

  var detailsCheck = document.createElement('details');
  var summaryCheck = document.createElement('summary');
  summaryCheck.textContent = 'Grading Checklist';
  detailsCheck.appendChild(summaryCheck);
  var checkDiv = document.createElement('div');
  checkDiv.innerHTML = checklistHTML;
  detailsCheck.appendChild(checkDiv);
  promptDiv.appendChild(detailsCheck);
  part1.appendChild(promptDiv);

  // Student response div
  var responseDiv = document.createElement('div');
  responseDiv.className = 'student-response';
  if (s.response) {
    responseDiv.textContent = s.response;
  } else {
    var em = document.createElement('em');
    em.textContent = '(No response submitted)';
    responseDiv.appendChild(em);
  }
  part1.appendChild(responseDiv);

  // Empty span (matches MyOpenMath structure)
  part1.appendChild(document.createElement('span'));

  region.appendChild(part1);

  // Part 2 heading
  var p2heading = document.createElement('p');
  p2heading.className = 'seqsep';
  p2heading.setAttribute('role', 'heading');
  p2heading.setAttribute('aria-level', '3');
  p2heading.textContent = 'Part 2 of 2';
  region.appendChild(p2heading);

  // Part 2 content div
  var part2 = document.createElement('div');
  var detailsRubric = document.createElement('details');
  var summaryRubric = document.createElement('summary');
  summaryRubric.textContent = 'Rubric & Model Response';
  detailsRubric.appendChild(summaryRubric);
  var rubDiv = document.createElement('div');
  rubDiv.innerHTML = rubricHTML + modelResponseHTML;
  detailsRubric.appendChild(rubDiv);
  part2.appendChild(detailsRubric);
  region.appendChild(part2);

  wrapper.appendChild(region);

  // Score details
  var scoreDetails = document.createElement('div');
  scoreDetails.className = 'scoredetails';

  var label = document.createElement('label');
  label.textContent = 'Score: ';
  var scoreInput = document.createElement('input');
  scoreInput.type = 'text';
  scoreInput.setAttribute('aria-label', 'Score');
  scoreInput.name = 'score-' + i;
  scoreInput.value = '';
  label.appendChild(scoreInput);
  label.appendChild(document.createTextNode(' /10'));
  scoreDetails.appendChild(label);

  var fullCred = document.createElement('a');
  fullCred.className = 'fullcredlink';
  fullCred.textContent = 'Full credit';
  fullCred.onclick = function() {
    this.closest('.scoredetails').querySelector('input').value = '10';
  };
  scoreDetails.appendChild(fullCred);

  var fbBox = document.createElement('div');
  fbBox.className = 'fbbox';
  fbBox.setAttribute('role', 'textbox');
  fbBox.setAttribute('aria-label', 'Feedback');
  fbBox.setAttribute('contenteditable', 'true');
  scoreDetails.appendChild(fbBox);

  var hidden = document.createElement('input');
  hidden.type = 'hidden';
  hidden.name = 'fb-' + i;
  hidden.value = '';
  scoreDetails.appendChild(hidden);

  wrapper.appendChild(scoreDetails);
  form.appendChild(wrapper);
});
</script>
</body>
</html>
