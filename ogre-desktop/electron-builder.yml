appId: com.ogre.app
productName: OGRE

directories:
  output: dist-electron

asar: true
npmRebuild: true

files:
  - dist/**
  - dist-electron/main.js
  - dist-electron/preload.cjs
  - node_modules/**
  - package.json

extraResources:
  - from: ../grading-server
    to: server-bundle
    filter:
      - '**/*'
      - '!node_modules/typescript/**'
      - '!node_modules/@types/**'
      - '!node_modules/bun-types/**'
      - '!node_modules/@yao-pkg/**'
      - '!node_modules/vite/**'
      - '!node_modules/vitest/**'
      - '!node_modules/@vitest/**'
      - '!node_modules/rollup/**'
      - '!node_modules/@rollup/**'
      - '!node_modules/@babel/**'
      - '!node_modules/@esbuild/**'
      - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
      - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**'
      - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
      - '!**/*.md'
      - '!**/*.map'
      - '!**/test/**'
      - '!**/tests/**'
      - '!**/__tests__/**'

linux:
  target:
    - AppImage

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  oneClick: true
  perMachine: false

publish:
  provider: github
  owner: shuff57
  repo: O.G.R.E-OllamaGradingRubricEvaluator
