appId: com.ogre.app
productName: OGRE

directories:
  output: dist-electron

asar: true
npmRebuild: true

files:
  - dist/**
  - dist-electron/**
  - node_modules/**
  - package.json

extraResources:
  - from: ../grading-server
    to: server-bundle
    filter:
      - '**/*'

linux:
  target:
    - AppImage

win:
  target:
    - nsis

nsis:
  oneClick: false
