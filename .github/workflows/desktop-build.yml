name: Build O.G.R.E Desktop

on:
  push:
    branches:
      - desktop
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - desktop
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-desktop:
    name: Build Desktop App (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install desktop app dependencies
        run: bun install --frozen-lockfile
        working-directory: ogre-desktop

      - name: Build Electron app
        run: bunx vite build && bunx electron-builder --win --publish never
        working-directory: ogre-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build artifacts
        run: |
          Get-ChildItem -Recurse ogre-desktop/dist-electron/ -Include *.exe,*.yml | ForEach-Object {
            Write-Output "$($_.FullName) - $([math]::Round($_.Length / 1MB, 2)) MB"
          }
        shell: pwsh

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ogre-desktop-windows-nsis
          path: ogre-desktop/dist-electron/*.exe
          if-no-files-found: warn

      - name: Upload updater manifest
        uses: actions/upload-artifact@v4
        with:
          name: ogre-desktop-updater
          path: ogre-desktop/dist-electron/latest.yml
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ogre-desktop-windows-nsis/*.exe
            artifacts/ogre-desktop-updater/latest.yml
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
