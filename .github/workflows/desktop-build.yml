name: Build O.G.R.E Desktop

on:
  push:
    branches:
      - desktop
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - desktop
      - main
  workflow_dispatch:

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-desktop:
    name: Build Desktop App (Windows)
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ogre-desktop/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ogre-desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install grading-server dependencies
        run: |
          cd grading-server
          bun install

      - name: Build grading-server sidecar binary
        run: |
          cd grading-server
          bun build --compile --target=bun-windows-x64 server.js --outfile ../ogre-desktop/src-tauri/binaries/grading-server-x86_64-pc-windows-msvc.exe
      
      - name: Verify sidecar binary
        run: |
          if (!(Test-Path ogre-desktop/src-tauri/binaries/grading-server-x86_64-pc-windows-msvc.exe)) {
            Write-Error "Sidecar binary not found!"
            exit 1
          }
          $size = (Get-Item ogre-desktop/src-tauri/binaries/grading-server-x86_64-pc-windows-msvc.exe).Length / 1MB
          Write-Output "Sidecar binary size: $([math]::Round($size, 2)) MB"
        shell: pwsh

      - name: Install desktop app dependencies
        run: |
          cd ogre-desktop
          npm ci

      - name: Build Tauri app
        run: |
          cd ogre-desktop
          npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: List build artifacts
        run: |
          Get-ChildItem -Recurse ogre-desktop/src-tauri/target/release/bundle/ -Include *.msi,*.exe | ForEach-Object {
            Write-Output "$($_.FullName) - $([math]::Round($_.Length / 1MB, 2)) MB"
          }
        shell: pwsh

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: ogre-desktop-windows-msi
          path: ogre-desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ogre-desktop-windows-nsis
          path: ogre-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ogre-desktop-updater
          path: |
            ogre-desktop/src-tauri/target/release/bundle/**/latest.json
            ogre-desktop/src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ogre-desktop-windows-msi/*.msi
            artifacts/ogre-desktop-windows-nsis/*.exe
            artifacts/ogre-desktop-updater/latest.json
            artifacts/ogre-desktop-updater/**/*.sig
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
