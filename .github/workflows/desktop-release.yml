name: Desktop release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, flag: --linux }
          - { os: windows-latest, flag: --win }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: ogre-desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: grading-server
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
