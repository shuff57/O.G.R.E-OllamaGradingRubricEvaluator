name: Desktop release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, flag: --linux }
          - { os: windows-latest, flag: --win }
    runs-on: ${{ matrix.os }}
    # Normal runs take ~1.5-2 min per leg; cap hung runs instead of the 360 min default.
    timeout-minutes: 20
    defaults: { run: { working-directory: ogre-desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # --no-audit/--no-fund skip npm's advisory and funding network calls; the installed tree is unchanged.
      - run: npm install --no-audit --no-fund
        working-directory: grading-server
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx electron-builder ${{ matrix.flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
