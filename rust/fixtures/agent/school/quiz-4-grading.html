  <p>Question 2: solve x^2 - 5x + 6 = 0 and say how you know.</p>
  <div class="submission">
    <span class="student-name">Avery, Sam</span>

    <label>Feedback <textarea name="feedback_1"></textarea></label>
  </div>
  <div class="submission">
    <span class="student-name">Brook, Kai</span>

    <label>Score <input type="number" name="score_2" class="score"></label> <span>/ 10</span>
    <label>Feedback <textarea name="feedback_2"></textarea></label>
  </div>
  <div class="submission">
    <span class="student-name">Casey, Lin</span>
    <div class="answer">I used the quadratic formula and got 3 and 2.</div>
