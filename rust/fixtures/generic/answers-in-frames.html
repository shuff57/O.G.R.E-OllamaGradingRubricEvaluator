<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Homework 6: answers in a viewer</title>
</head>
<body>
  <!--
    A made-up grading page whose score boxes are in the page and whose
    answers are each shown in a frame from somewhere else (answer-frame.html).
    Written for OGRE's tests; the students are invented.
  -->
  <h1>Homework 6, question 2</h1>
  <div class="submission">
    <span class="student-name">Avery, Sam</span>
    <iframe class="answer-viewer" src="answer-frame.html?who=1" width="600" height="120" title="Answer"></iframe>
    <label>Score <input type="number" name="score_1" class="score"></label> <span>/ 5</span>
  </div>
  <div class="submission">
    <span class="student-name">Brook, Kai</span>
    <iframe class="answer-viewer" src="answer-frame.html?who=2" width="600" height="120" title="Answer"></iframe>
    <label>Score <input type="number" name="score_2" class="score"></label> <span>/ 5</span>
  </div>
  <div class="submission">
    <span class="student-name">Casey, Lin</span>
    <iframe class="answer-viewer" src="answer-frame.html?who=3" width="600" height="120" title="Answer"></iframe>
    <label>Score <input type="number" name="score_3" class="score"></label> <span>/ 5</span>
  </div>
</body>
</html>
