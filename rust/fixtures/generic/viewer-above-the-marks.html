<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lakeside Academy: marking</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    main.entry { padding: 8px 16px; }
    iframe { display: block; width: 100%; height: 70vh; border: 0; }
  </style>
</head>
<body>
  <!--
    A made-up marking page that is mostly one frame, and the frame is not a
    grading tool: it is a viewer of the student's work (answer-frame.html).
    The name, the marks and the comments are on the page itself. Written
    for OGRE's tests; the student is invented.
  -->
  <main class="entry">
    <p class="who">Avery, Sam</p>
    <iframe id="viewer" title="Submitted work" src="answer-frame.html?who=1"></iframe>
    <label>Marks <input type="number" id="marks" name="marks"></label> <span>/ 5</span>
    <label>Comments <textarea id="comments" name="comments"></textarea></label>
    <button type="button" id="keep">Save</button>
  </main>
</body>
</html>
