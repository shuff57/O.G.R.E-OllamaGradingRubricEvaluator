<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Riverside District portal</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    nav { padding: 6px 16px; background: #dde; }
    iframe { display: block; width: 100%; height: 92vh; border: 0; }
  </style>
</head>
<body>
  <!--
    A made-up district portal that shows a school's site inside a frame, and
    that site shows its grading tool inside a frame of its own
    (tool-in-a-frame.html, which holds simple-batch.html). Written for
    OGRE's tests. Neither page around the tool has a student on it.
  -->
  <nav><strong>Riverside District</strong> &middot; Staff portal</nav>
  <iframe id="course_frame" name="course_frame" title="Course" src="tool-in-a-frame.html"></iframe>
</body>
</html>
