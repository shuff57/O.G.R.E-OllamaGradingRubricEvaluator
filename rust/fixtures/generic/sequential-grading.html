<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sequential / One-at-a-Time Grading</title>
</head>
<body>
  <!--
    Sequential grading: only ONE student is shown at a time.
    Navigation buttons cycle through students.
    Tests that the snapshot engine doesn't need batch-row patterns.
  -->
  <div id="grading-app">
    <header>
      <h2>Student 3 of 30: Carol Davis</h2>
      <div class="nav-controls">
        <button id="prev-student">&laquo; Previous</button>
        <button id="next-student">Next &raquo;</button>
      </div>
    </header>

    <main>
      <section id="student-response">
        <h3>Response</h3>
        <div class="response-text" data-student="carol.davis@example.com">
          The derivative of x^3 is 3x^2 by the power rule.
        </div>
      </section>

      <section id="grading-panel">
        <form id="grade-form">
          <fieldset>
            <legend>Grade (out of 15)</legend>
            <label for="score-input">Score:</label>
            <input type="number" id="score-input" name="score" min="0" max="15" step="0.5" />
            <label for="feedback-input">Feedback:</label>
            <textarea id="feedback-input" name="feedback" rows="4" cols="50"></textarea>
          </fieldset>
          <button type="submit">Save &amp; Next</button>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
