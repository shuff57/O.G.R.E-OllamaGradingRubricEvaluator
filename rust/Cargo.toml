[workspace]
resolver = "3"
members = ["crates/*"]
# OGRE with a built-in browser: a workspace of its own, see embedded/Cargo.toml.
exclude = ["embedded"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
ogre-agent = { path = "crates/ogre-agent" }
ogre-core = { path = "crates/ogre-core" }
ogre-grader = { path = "crates/ogre-grader" }
ogre-harness = { path = "crates/ogre-harness" }
ogre-llm = { path = "crates/ogre-llm" }

ammonia = "4"
async-trait = "0.1"
# No default features: the OpenGL renderer instead of wgpu (the app draws
# plain UI, and wgpu with its shader compiler is several megabytes), and no
# system font lookup (the app ships its own fonts).
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "wayland",
    "x11",
] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
egui_extras = "0.37"
htmd = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Only for its features: without these a window on GNOME (Wayland) gets no
# title bar, and the Wayland library is linked instead of loaded when present.
winit = { version = "0.30", default-features = false, features = [
    "wayland-csd-adwaita",
    "wayland-dlopen",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }
keyring = "4"
image = { version = "0.25", default-features = false, features = ["png"] }

# One small binary to hand to a teacher. The same settings as verSHion.
[profile.release]
strip = true
lto = "fat"
opt-level = "s"
codegen-units = 1
panic = "abort"
