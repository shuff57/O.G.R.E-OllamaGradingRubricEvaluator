[package]
name = "ogre-llm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["http"]
# The reqwest-backed `HttpProvider` and the async `with_retry`. Without it the
# crate does no I/O and builds for wasm32-unknown-unknown.
http = ["dep:reqwest", "dep:tokio"]

[dependencies]
async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true

reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }
