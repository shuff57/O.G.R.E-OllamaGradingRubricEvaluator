[package]
name = "ogre-harness"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["cdp"]
# Drive a Chrome or Edge browser over the DevTools Protocol. Desktop only.
cdp = ["dep:base64", "dep:libc", "dep:tokio"]

[dependencies]
ogre-core.workspace = true
ogre-llm = { path = "../ogre-llm", default-features = false }

ammonia.workspace = true
async-trait.workspace = true
htmd.workspace = true
regex = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Screenshots arrive as base64.
base64 = { version = "0.22", optional = true }
tokio = { workspace = true, optional = true, features = ["io-util", "process"] }

# For handing Chrome its pipe on the descriptors it expects.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
# With its HTTP client, for the discovery test against a local Ollama.
ogre-llm = { path = "../ogre-llm" }
# The mock Canvas server in tests/canvas.rs.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { workspace = true, features = ["net"] }
