[package]
name = "ogre-harness"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["cdp"]
# Drive a Chrome or Edge browser over the DevTools Protocol. Desktop only.
cdp = ["dep:chromiumoxide", "dep:futures", "dep:tokio"]

[dependencies]
ogre-core.workspace = true
ogre-llm = { path = "../ogre-llm", default-features = false }

ammonia.workspace = true
async-trait.workspace = true
htmd.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

chromiumoxide = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
# With its HTTP client, for the discovery test against a local Ollama.
ogre-llm = { path = "../ogre-llm" }
# The mock Canvas server in tests/canvas.rs.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { workspace = true, features = ["net"] }
